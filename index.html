<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordLift తెలుగు - 10,000 Advanced Vocabulary</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    header h1 { font-size: 1.8rem; font-weight: 700; }
    header h1 span { color: var(--accent); }

    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }

    .search-box:focus { outline: 2px solid var(--accent); }

    .stats-badge {
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .word-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .word-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    .word-index {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .meaning-box {
      background: #0f172a80;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .meaning-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .telugu-text { font-size: 1.05rem; font-weight: 600; color: #38bdf8; }

    .example-box { font-size: 0.9rem; line-height: 1.4; color: var(--text-muted); }
    .example-box strong { color: var(--text); }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
      padding: 16px 0;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:disabled { background: var(--border); cursor: not-allowed; opacity: 0.6; }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }

    #page-info { font-weight: 600; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div>
      <p style="color: var(--accent); font-size: 0.85rem; font-weight: 700; tracking: 1px;">ADVANCED VOCABULARY</p>
      <h1>WordLift <span>తెలుగు</span></h1>
    </div>
    <div id="total-count" class="stats-badge">Loading words...</div>
  </header>

  <div class="controls-bar">
    <input type="text" id="search-input" class="search-box" placeholder="Search English word or Telugu meaning..." />
  </div>

  <main id="words-container" class="word-grid"></main>

  <div class="pagination">
    <button id="prev-btn" class="btn">Previous</button>
    <span id="page-info">Page 1 of 1</span>
    <button id="next-btn" class="btn">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
